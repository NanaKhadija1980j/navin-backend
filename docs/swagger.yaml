  /api/shipments:
    get:
      summary: Get paginated shipments with offset-based pagination
      description: Returns a paginated list of shipments. Uses offset-based pagination with page and limit parameters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
          description: >
            Filter by status. Single value or comma-separated list
            (e.g. CREATED,IN_TRANSIT).
          example: CREATED,IN_TRANSIT
        - in: query
          name: priority
          schema:
            type: string
          description: >
            Filter by priority. Single value or comma-separated list
            (e.g. URGENT,STANDARD).
          example: URGENT,STANDARD
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts at 1)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page (max 100)
        - in: query
          name: origin
          schema:
            type: string
          description: Filter by origin location (case-insensitive partial match)
        - in: query
          name: destination
          schema:
            type: string
          description: Filter by destination location (case-insensitive partial match)
        - in: query
          name: trackingNumber
          schema:
            type: string
          description: Filter by tracking number (case-insensitive partial match)
        - in: query
          name: q
          schema:
            type: string
          description: >
            Full-text search across trackingNumber, origin, and destination
            (MongoDB text index).
          example: NVN-123
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: Include shipments created at or after this timestamp
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: Include shipments created at or before this timestamp
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, priority, expectedDelivery]
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        '200':
          description: Paginated shipments retrieved successfully
          headers:
            X-Request-ID:
              description: Unique request identifier for tracking and debugging
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Shipments retrieved'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                      limit:
                        type: integer
                        description: Items per page
                        example: 20
                      total:
                        type: integer
                        description: Total number of shipments matching the query
                        example: 150
        '400':
          description: Invalid query parameters (e.g., page < 1, limit > 100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a shipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created
