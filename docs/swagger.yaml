openapi: 3.0.0
info:
  title: Navin Backend API
  version: 1.0.0
  description: |
    Navin logistics/supply-chain API.

    ## Pagination
    Use **cursor** pagination (`cursor`, `limit` → `meta.nextCursor`, `meta.hasMore`) for large
    collections (telemetry, anomalies, payments). Use **offset** pagination (`page`, `limit` →
    `meta.page`, `meta.limit`, `meta.total`) for bounded admin lists (shipments).
    Pagination fields always live in `meta`, never in `data`. See `docs/PAGINATION.md`.
x-rate-limit:
  standard:
    limit: 100
    window: 15 minutes
  strict:
    limit: 20
    window: 15 minutes
  login:
    limit: 5
    window: 15 minutes
paths:
  /api/webhooks/iot:
    post:
      summary: IoT webhook endpoint for telemetry data
      description: Receives telemetry data from IoT sensors. Requires API key authentication.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipmentId
                - temperature
                - humidity
                - latitude
                - longitude
                - batteryLevel
                - timestamp
              properties:
                shipmentId:
                  type: string
                  description: MongoDB ObjectId of the shipment
                temperature:
                  type: number
                  description: Temperature in Celsius
                humidity:
                  type: number
                  description: Humidity percentage
                latitude:
                  type: number
                  description: GPS latitude
                longitude:
                  type: number
                  description: GPS longitude
                batteryLevel:
                  type: number
                  description: Battery level percentage
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of the telemetry reading
      responses:
        '201':
          description: Telemetry data received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      shipmentId:
                        type: string
                      temperature:
                        type: number
                      humidity:
                        type: number
                      latitude:
                        type: number
                      longitude:
                        type: number
                      batteryLevel:
                        type: number
                      timestamp:
                        type: string
                        format: date-time
                      dataHash:
                        type: string
                      stellarTxHash:
                        type: string
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/webhooks/stellar:
    post:
      summary: Stellar proof-of-delivery webhook
      description: >
        Receives Stellar settlement callbacks for proof-of-delivery events.
        Requires a valid HMAC-SHA256 signature in the x-stellar-signature header,
        computed over the raw request body using STELLAR_WEBHOOK_SECRET.
      security:
        - stellarSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - type
                - paymentId
                - transactionHash
                - amount
                - timestamp
              properties:
                id:
                  type: string
                  description: Unique Stellar webhook event identifier
                type:
                  type: string
                  enum: [release, escrow, failed]
                  description: Stellar webhook event type
                paymentId:
                  type: string
                  description: Payment identifier linked to the shipment
                transactionHash:
                  type: string
                  description: Stellar transaction hash for the settlement event
                amount:
                  type: number
                  description: Amount associated with the Stellar event
                timestamp:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp for the webhook event
                signature:
                  type: string
                  description: Optional HMAC signature value for webhook verification
      responses:
        '200':
          description: Stellar webhook received and processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      event:
                        type: string
                      paymentId:
                        type: string
                      status:
                        type: string
                      transactionHash:
                        type: string
        '400':
          description: Invalid Stellar webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid x-stellar-signature header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      summary: Health check
      description: Public health endpoint used by load balancers and uptime monitors.
      responses:
        '200':
          description: Service health metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: active
                      uptime:
                        type: number
                        description: Process uptime in seconds
                      timestamp:
                        type: string
                        format: date-time
                        description: Current UTC timestamp
  /api/auth/api-keys:
    post:
      summary: Create a new API key
      description: Generates a new API key for machine-to-machine authentication. The raw API key is returned only once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - organizationId
              properties:
                name:
                  type: string
                  description: Descriptive name for the API key
                organizationId:
                  type: string
                  description: MongoDB ObjectId of the organization
                shipmentId:
                  type: string
                  description: Optional MongoDB ObjectId of a specific shipment
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apiKey:
                        type: string
                        description: Raw API key (shown only once)
                      id:
                        type: string
                      name:
                        type: string
                      organizationId:
                        type: string
                      shipmentId:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/signup:
    post:
      summary: Register a new user
      description: Creates a new user account. organizationId is optional.
      security: []
      description: Creates a new user account. organizationId is optional. Public signup does not allow privileged role assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                name:
                  type: string
                  minLength: 1
                  description: User full name
                password:
                  type: string
                  minLength: 8
                  description: Password (minimum 8 characters)
                organizationId:
                  type: string
                  description: Optional organization ID to associate with user
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                      token:
                        type: string
                  meta:
                    type: object
        '400':
          description: Validation error (e.g., password too short, missing required fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: 'null'
  /api/audit-logs:
    get:
      summary: Retrieve compliance audit logs
      description: Returns audit history for compliance and traceability with filter and cursor pagination support.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: userId
          schema:
            type: string
          description: Filter by actor user id
        - in: query
          name: action
          schema:
            type: string
          description: Filter by action name
        - in: query
          name: resource
          schema:
            type: string
          description: Filter by resource category
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: Start of timestamp range (inclusive)
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: End of timestamp range (inclusive)
      responses:
        '200':
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        userId:
                          type: string
                        action:
                          type: string
                        resource:
                          type: string
                        resourceId:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        metadata:
                          type: object
                  meta:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                      hasMore:
                        type: boolean
                      total:
                        type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
                $ref: '#/components/schemas/ErrorResponse'
  /api/shipment-templates:
    get:
      summary: List all shipment templates for the caller's organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Templates retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShipmentTemplate'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create a new shipment template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ShipmentTemplate'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/shipment-templates/{id}:
    get:
      summary: Get a shipment template by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ShipmentTemplate'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Template not found
    patch:
      summary: Update a shipment template
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentTemplateRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ShipmentTemplate'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Template not found
    delete:
      summary: Soft-delete a shipment template
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ShipmentTemplate'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Template not found
  /api/auth/login:

    post:
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                  meta:
                    type: object
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  retryAfter:
                    type: integer
                  data:
                    type: 'null'
  /api/auth/logout:
    post:
      summary: Logout current user
      description: Invalidates the current JWT (server-side revocation). Requires Authorization header.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
        '401':
          description: Missing or invalid auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/forgot-password:
    post:
      summary: Request a password reset email
      description: >-
        Sends a password reset email to the specified address. Always returns a
        success response to prevent email enumeration.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Registered email address
      responses:
        '200':
          description: Reset email sent (or silently ignored for unknown emails)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: 'null'
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/api-keys/{organizationId}:
    get:
      summary: List API keys for an organization
      description: Returns all active API keys for the specified organization (without exposing the raw keys)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the organization
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        organizationId:
                          type: string
                        shipmentId:
                          type: string
                        isActive:
                          type: boolean
                        lastUsedAt:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/api-keys/{apiKeyId}:
    delete:
      summary: Revoke an API key
      description: Deactivates an API key, preventing it from being used for authentication
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: apiKeyId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the API key
      responses:
        '200':
          description: API key revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/me:
    get:
      summary: Get current authenticated user's profile
      description: Returns the profile of the authenticated user (excluding passwordHash). Requires valid JWT.
      security:
        - bearerAuth: []
      tags:
        - Users
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User profile retrieved successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                      organizationId:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/invitations:
    post:
      summary: Generate user invitation link
      description: >-
        Creates a signed 48-hour invitation token bound to the inviter
        organization and target role, and sends an invitation email to the
        target address.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [ADMIN, MANAGER, VIEWER, CUSTOMER]
      responses:
        '201':
          description: Invitation generated
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/invitations/verify:
    get:
      summary: Verify invitation token
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation token is valid
        '401':
          description: Invalid or expired invitation token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/invitations/accept:
    post:
      summary: Accept invitation and create account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - name
                - password
              properties:
                token:
                  type: string
                name:
                  type: string
                password:
                  type: string
                  minLength: 8
                  description: Password (minimum 8 characters)
      responses:
        '201':
          description: Invitation accepted
        '401':
          description: Invalid or expired invitation token
        '409':
          description: Email already in use
  /api/users/{id}:
    delete:
      summary: Delete a user (soft delete)
      description: Soft-deletes a user by setting deletedAt. Requires ADMIN or SUPER_ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the user to delete
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User deleted successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                      organizationId:
                        type: string
                      deletedAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid or missing id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users:
    post:
      summary: Create a new user (admin only)
      description: >
        Creates a new user within the authenticated admin's organization.
        Requires ADMIN or SUPER_ADMIN role. The organizationId is always
        taken from the authenticated JWT token — it cannot be supplied in
        the request body, preventing cross-organisation user creation.
      security:
        - bearerAuth: []
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                name:
                  type: string
                  minLength: 1
                  description: User full name
                role:
                  type: string
                  enum: [ADMIN, MANAGER, VIEWER, CUSTOMER]
                  default: VIEWER
                  description: Role to assign to the new user
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                      organizationId:
                        type: string
        '400':
          description: Validation error — missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — insufficient role (must be ADMIN or SUPER_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List users
      description: Returns a paginated list of users. Requires authentication and role (ADMIN/MANAGER/SUPER_ADMIN).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of users to return per page
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for the next page (ObjectId of the last user from the previous page)
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        email:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                        organizationId:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      hasMore:
                        type: boolean
                      nextCursor:
                        type: string
                        nullable: true
  /api/users/team:
    post:
      summary: Create a user as a team member (admin only)
      description: Create a user within the organization. Requires ADMIN or SUPER_ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email:
                  type: string
